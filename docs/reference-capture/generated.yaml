  #   any tool.
  # WARN: has no alias
  #   Whatever invokes it is pointed at a mutable target, so there is no
  #   one-step rollback. Adding an alias is additive and breaks nothing.
  SlackApprove:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: slackApprove
      Runtime: provided.al2
      Handler: bootstrap
      Architectures: [x86_64]
      MemorySize: 256
      Timeout: 15
      ReservedConcurrentExecutions: 2
      Role: !GetAtt ReleasebotSlackApproveExecutionRole3j42Cx6xDYj3.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: releasebot/slackApprove.zip   # TODO confirm the key in the target account
      Environment:
        Variables:
          GITHUB_APPROVAL_TOKEN: !Ref GithubApprovalTokenParam
          GITHUB_ENVIRONMENT_ID: 23806238990
          GITHUB_OWNER: vamsiatluri
          GITHUB_REPO: releasebot-demo
          SLACK_APPROVERS: U0C7UFTGKNW
          SLACK_SIGNING_SECRET: !Ref SlackSigningSecretParam

  # The source function had NO alias, so nothing there has a one-step
  # rollback. Adding one is additive and changes no behaviour.
  SlackApproveVersion:
    Type: AWS::Lambda::Version
    Properties: {FunctionName: !Ref SlackApprove}
  SlackApproveAlias:
