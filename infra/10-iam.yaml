              # Lambda writes the on-failure destination AS THE FUNCTION, using
              # this role -- not as a service principal. Without this the
              # destination silently does nothing, which is the worst possible
              # outcome for a queue whose entire job is to catch silence.
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:releasebot-async-failures'
        - PolicyName: self-invoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The function may invoke ITSELF and nothing else -- that is the
              # whole grant. It is how the Slack 3-second acknowledgement is
              # honoured without losing the work: acknowledge, then dispatch a
              # real second invocation that has its own lifetime.
              #
              # ⚠️ Scoped to this one function name plus its versions and
              # aliases. `lambda:InvokeFunction` on `*` would let a release bot
              # invoke every function in the account, which is a far larger
              # thing than "finish your own job".
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:releaseAutomationMergebackTest'
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:releaseAutomationMergebackTest:*'
        - PolicyName: release-ledger
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # WRITE ONLY, and only into this environment's partition. A
              # release-cutting bot has no reason to read the ledger back, and
              # a bot that can read every property's release history is a
              # broader thing than a bot that can append to one.
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/releasebot-ledger'
                Condition:
                  'ForAllValues:StringEquals':
                    'dynamodb:LeadingKeys': ['ENV#test']
        - PolicyName: secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretsPrefix}/test/*'
              # ⛔ BOTH SERVICES. kms:ViaService scoped to Secrets Manager
              # alone silently refuses a Parameter Store SecureString read --
              # that decrypt goes via SSM, not Secrets Manager. The failure
              # arrives as an AccessDenied naming KMS, so the obvious reading
              # is "the key policy is wrong" and the obvious fix is to widen
              # the key policy, which changes nothing. The condition is the
              # thing that was wrong, and it was wrong in the direction that
              # looks correct.
              - Effect: Allow
                Action: [kms:Decrypt]
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService:
                      - !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'
                      - !Sub 'ssm.${AWS::Region}.amazonaws.com'

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
    Export: {Name: !Sub '${AWS::StackName}-DeployRoleArn'}
  CutReleaseExecutionRoleArn:
    Value: !GetAtt CutReleaseExecutionRole.Arn
    Export: {Name: !Sub '${AWS::StackName}-CutReleaseExecRoleArn'}
  CutReleaseTestExecutionRoleArn:
    Value: !GetAtt CutReleaseTestExecutionRole.Arn
    Export: {Name: !Sub '${AWS::StackName}-CutReleaseTestExecRoleArn'}
  MergebackTestExecutionRoleArn:
    Value: !GetAtt MergebackTestExecutionRole.Arn
    Export: {Name: !Sub '${AWS::StackName}-MergebackTestExecRoleArn'}
  MergebackExecutionRoleArn:
    Value: !GetAtt MergebackExecutionRole.Arn
    Export: {Name: !Sub '${AWS::StackName}-MergebackExecRoleArn'}
