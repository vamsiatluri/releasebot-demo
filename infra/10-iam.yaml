AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ReleaseBot - identity. GitHub Actions OIDC deploy role plus the Lambda
  execution roles. Deployed FIRST and separately from the application stacks so
  that rolling the application back never rolls back the trust relationship the
  pipeline needs to roll it back with.

Parameters:
  GitHubOrg:
    Type: String
    Default: msnbc
  GitHubRepo:
    Type: String
    Default: releasebot
  GitHubOwnerId:
    Type: String
    Default: ''
    Description: >
      Numeric account id of the repo owner (gh api user --jq .id).
  GitHubRepoId:
    Type: String
    Default: ''
    Description: >
      Numeric repository id (gh api repos/<owner>/<repo> --jq .id).

      ⚠️ GitHub is migrating accounts to an IMMUTABLE-ID subject claim. On a
      migrated account the token's `sub` is
      repo:<owner>@<ownerId>/<repo>@<repoId>:ref:refs/heads/main
      -- NOT the familiar repo:<owner>/<repo>:ref:... form. A trust policy
      written for the old shape denies EVERY assume-role, and the error says
      nothing about why. This account is already on the new form (cost an hour
      to find on a previous project). Supply both ids and the policy trusts
      both shapes; leave them empty and it trusts only the legacy shape.
  CreateOIDCProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >
      An account can hold only ONE provider for token.actions.githubusercontent.com.
      Set true only in an account that does not already have one; a second
      CreateOpenIDConnectProvider fails with EntityAlreadyExists and rolls the
      whole stack back.
  SecretsPrefix:
    Type: String
    Default: releasebot
    Description: Secrets Manager name prefix this account's functions may read.
  SetApiGatewayAccountRole:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >
      API Gateway execution logging (a stage's LoggingLevel / MethodSettings) is
      gated on an ACCOUNT-LEVEL CloudWatch role, one per account per region. A
      fresh account has none, and a stage that asks for logging fails with
      "CloudWatch Logs role ARN must be set in account settings" -- which reads
      like a stage problem and is not. It lives here rather than in the API stack
      because AWS::ApiGateway::Account is a singleton: owning it from an app
      stack means deleting that stack silently disables logging for every other
      API in the account. Set true once per account+region.

Conditions:
  MakeProvider: !Equals [!Ref CreateOIDCProvider, 'true']
  HasImmutableIds: !And
    - !Not [!Equals [!Ref GitHubOwnerId, '']]
    - !Not [!Equals [!Ref GitHubRepoId, '']]
  SetApiAccount: !Equals [!Ref SetApiGatewayAccountRole, 'true']

Resources:

  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # Thumbprints are no longer verified by IAM for this provider, but the
      # field is still required by the API.
      ThumbprintList: ['6938fd4d98bab03faadb97b34396831e3780aea1']

  # The deploy identity. This replaces the "add production-account repository
  # secrets" line in the SOW: no AWS access key is ever minted, stored in GitHub,
  # or rotated, because none exists.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'releasebot-github-deploy-${AWS::AccountId}'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Pinned to a branch, not StringLike on repo:org/repo:*. The
              # loose form lets ANY ref in the repo -- including a pull request
              # from a fork -- assume a role that can rewrite production
              # Lambdas.
              StringLike:
                token.actions.githubusercontent.com:sub: !If
                  - HasImmutableIds
                  - - !Sub 'repo:${GitHubOrg}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:ref:refs/heads/main'
                    - !Sub 'repo:${GitHubOrg}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:environment:test'
                    - !Sub 'repo:${GitHubOrg}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:environment:production'
                    - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/main'
                    - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:test'
                    - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:production'
                  - - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/main'
                    - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:test'
                    - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:production'
      Policies:
        - PolicyName: releasebot-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageReleaseBotFunctionsOnly
                Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:PublishVersion
                  - lambda:UpdateAlias
                  - lambda:GetAlias
                  - lambda:ListVersionsByFunction
                  - lambda:InvokeFunction
                Resource:
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:cutRelease*'
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:releaseAutomationMergeback*'
              # The pipeline publishes its own verification results so a
              # behaviour failure is visible to someone who does not read CI.
              #
              # ⚠️ PutMetricData takes no resource ARN -- Resource must be "*".
              # The namespace condition is what keeps it least-privilege: this
              # role can write ReleaseBot metrics and nothing else. Without the
              # condition, "Resource: *" here means the deploy role can forge
              # datapoints into ANY namespace in the account, including the ones
              # other teams alarm on.
              - Sid: PublishOwnVerificationMetricsOnly
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: ReleaseBot

              - Sid: PublishArtifacts
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::releasebot-artifacts-${AWS::AccountId}/*'
              - Sid: DeployInfrastructure
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplateSummary
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/releasebot-*/*'
              - Sid: ApiGatewayRedeploy
                Effect: Allow
                Action: [apigateway:POST, apigateway:GET, apigateway:PATCH]
                Resource: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/*'
              # iam:PassRole is the quiet privilege-escalation path: without a
              # PassedToService condition, the deploy role can attach ANY role
              # it can name to a Lambda it controls.
              - Sid: PassExecutionRolesToLambdaOnly
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/releasebot-exec-*'
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Condition: SetApiAccount
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: apigateway.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs'

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Condition: SetApiAccount
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  CutReleaseExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'releasebot-exec-cutrelease'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        # ⚠️ Required before a function can be VPC-attached. Lambda creates and
        # deletes an ENI in the subnet AS THE FUNCTION'S ROLE, so without this
        # the UpdateFunctionConfiguration call is rejected with
        # "The provided execution role does not have permissions to call
        # CreateNetworkInterface on EC2" -- which names the API but not the
        # managed policy that grants it.
        #
        # Granted unconditionally rather than behind a condition: it permits
        # nothing at all until a VpcConfig exists, and a role that gains
        # permissions at the same moment it gains a network is two changes to
        # debug instead of one.
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        - PolicyName: env-config
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # ⚠️ Scoped to ONE environment's path. There are FOUR execution
              # roles, one per function, because cutRelease and cutReleaseTest
              # previously SHARED a role -- so the per-environment boundary this
              # architecture is supposed to provide did not actually exist.
              # Found by simulate-principal-policy, not by reading the template.
              #
              # This is also the real argument against collapsing the pairs into
              # one function with two aliases: a function has exactly one
              # execution role whichever alias you arrive through, so the
              # collapsed version would need BOTH paths and both secret
              # subtrees, and the wall between the environments would be gone.
              - Effect: Allow
                Action: [ssm:GetParametersByPath, ssm:GetParameter, ssm:GetParameters]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/releasebot/prod'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/releasebot/prod/*'
        - PolicyName: async-failure-destination
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Lambda writes the on-failure destination AS THE FUNCTION, using
              # this role -- not as a service principal. Without this the
              # destination silently does nothing, which is the worst possible
              # outcome for a queue whose entire job is to catch silence.
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:releasebot-async-failures'
        - PolicyName: self-invoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The function may invoke ITSELF and nothing else -- that is the
              # whole grant. It is how the Slack 3-second acknowledgement is
              # honoured without losing the work: acknowledge, then dispatch a
              # real second invocation that has its own lifetime.
              #
              # ⚠️ Scoped to this one function name plus its versions and
              # aliases. `lambda:InvokeFunction` on `*` would let a release bot
              # invoke every function in the account, which is a far larger
              # thing than "finish your own job".
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:cutRelease'
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:cutRelease:*'
        - PolicyName: release-ledger
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # WRITE ONLY, and only into this environment's partition. A
              # release-cutting bot has no reason to read the ledger back, and
              # a bot that can read every property's release history is a
              # broader thing than a bot that can append to one.
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/releasebot-ledger'
                Condition:
                  'ForAllValues:StringEquals':
                    'dynamodb:LeadingKeys': ['ENV#prod']
        - PolicyName: secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Scoped to this function's own secrets by name prefix, not
              # secretsmanager:GetSecretValue on "*".
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretsPrefix}/prod/*'
              # ⛔ BOTH SERVICES. kms:ViaService scoped to Secrets Manager
              # alone silently refuses a Parameter Store SecureString read --
              # that decrypt goes via SSM, not Secrets Manager. The failure
              # arrives as an AccessDenied naming KMS, so the obvious reading
              # is "the key policy is wrong" and the obvious fix is to widen
              # the key policy, which changes nothing. The condition is the
              # thing that was wrong, and it was wrong in the direction that
              # looks correct.
              - Effect: Allow
                Action: [kms:Decrypt]
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService:
                      - !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'
                      - !Sub 'ssm.${AWS::Region}.amazonaws.com'

