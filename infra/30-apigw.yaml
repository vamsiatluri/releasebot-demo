AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ReleaseBot - edge. REST API with the SOW's two routes and two stages, plus the
  piece that makes a second account migration cheap next time: a custom domain,
  so the URL Slack and Jira point at is OURS and does not change when the
  underlying API id does.

Parameters:
  CutReleaseAliasArn:      {Type: String}
  CutReleaseTestAliasArn:  {Type: String}
  MergebackAliasArn:       {Type: String}
  MergebackTestAliasArn:   {Type: String}
  # Qualified "functionName:alias" pairs for the stage variables. Explicit
  # parameters rather than derived from the ARNs with Fn::Select -- CFN resolves
  # Fn::Select during change-set creation and the derived form failed there.
  # Clear beats clever in a file someone debugs at 2am.
  CutReleaseQualified:     {Type: String, Default: 'cutRelease:live'}
  CutReleaseTestQualified: {Type: String, Default: 'cutReleaseTest:live'}
  MergebackQualified:      {Type: String, Default: 'releaseAutomationMergeback:live'}
  MergebackTestQualified:  {Type: String, Default: 'releaseAutomationMergebackTest:live'}
  DomainName:
    Type: String
    Default: ''
    Description: e.g. releasebot.msnbc.example. Empty skips the custom domain.
  CertificateArn:
    Type: String
    Default: ''
  ThrottleRateLimit:       {Type: Number, Default: 10}
  ThrottleBurstLimit:      {Type: Number, Default: 20}
  AccessLogRetentionDays:  {Type: Number, Default: 30}

  # ── Who may reach PRODUCTION ────────────────────────────────────────────────
  # Comma-separated CIDRs: Slack's and Atlassian's published egress ranges.
  # EMPTY = no network restriction, which is the safe default for a template
  # that somebody will deploy before they have the list. A half-filled
  # allowlist is worse than none: it locks out the half you forgot and looks
  # like a broken bot.
  #
  # ⚠️ Deliberately applies to /prod ONLY, not /test. The behaviour suite runs
  # from GitHub-hosted runners, whose egress ranges are enormous and change
  # weekly. Allowlisting the whole API would stop CI being able to test the
  # thing it just deployed -- so the environment that is exercised by robots
  # stays open and the environment that serves real releases is restricted.
  ProdAllowedCidrs:
    Type: CommaDelimitedList
    Default: ''
    Description: CIDRs permitted to invoke the prod stage. Empty = unrestricted.

  # ⚠️⚠️ BUMP THIS WHENEVER ProdAllowedCidrs CHANGES.
  #
  # A REST API resource policy does NOT take effect until the stage is
  # REDEPLOYED, and CloudFormation only creates a new AWS::ApiGateway::Deployment
  # when something about the resource changes -- which a policy edit is not. So
  # the stack updates, the policy is visibly attached to the API, and the old
  # rules keep being enforced. It cost a round of debugging here: an allowlist
  # that excluded us returned 200 and looked like a broken condition.
  #
  # ⚠️ And even after a redeploy it takes 20-30 SECONDS to propagate. A probe
  # 6 seconds later reports the OLD behaviour, which reads as "the policy does
  # not work" rather than "the policy is not live yet".
  DeploymentNonce:
    Type: String
    Default: '1'
    Description: Change to force a new API deployment (required after a policy edit).

  # Requests per 5 minutes from one IP before WAF blocks it. This is ABUSE
  # protection, not rate limiting: a newsroom cutting releases makes a handful
  # of requests an hour, so anything near this number is not a person.
  WafRateLimitPer5Min:     {Type: Number, Default: 300}
  EnableWaf:               {Type: String, Default: 'true', AllowedValues: ['true','false']}

Conditions:
  RestrictProd: !Not [!Equals [!Join ['', !Ref ProdAllowedCidrs], '']]
  WafOn: !Equals [!Ref EnableWaf, 'true']
  HasDomain: !And
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref CertificateArn, '']]

Resources:

  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: releasebot
      Description: ReleaseBot (Robbie) release automation
      EndpointConfiguration: {Types: [REGIONAL]}
      # Slack posts form-encoded text; leaving binary media types unset means
      # API Gateway delivers it as a plain string and the HMAC is computed over
      # exactly the bytes Slack signed.
      #
      # ── The resource policy ─────────────────────────────────────────────────
      # Defence in depth, NOT the authentication. The HMAC is what proves a
      # request is from Slack; this decides who may make a request at all.
      # Without it, anyone on the internet can reach the endpoint and be
      # rejected -- which costs an invocation and a Lambda cold start BEFORE
      # the signature is ever checked.
      #
      # ⚠️ The DENY is scoped to the `prod` stage in the resource ARN. A REST
      # API has ONE resource policy for the whole API, so the per-stage split
      # has to be expressed in the Resource element, not by having two policies.
      #
      # ⚠️ And an explicit Deny beats any Allow, which is exactly what is
      # wanted: there is no later statement, condition or misconfiguration that
      # can re-permit a blocked source.
      Policy: !If
        - RestrictProd
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: execute-api:Invoke
              Resource: !Sub 'execute-api:/*'
            - Effect: Deny
              Principal: '*'
              Action: execute-api:Invoke
              Resource: !Sub 'execute-api:/prod/*'
              Condition:
                NotIpAddress:
                  'aws:SourceIp': !Ref ProdAllowedCidrs
        - !Ref 'AWS::NoValue'

  BetaResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: beta

  CutResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref Api, ParentId: !Ref BetaResource, PathPart: cut}

  MergeResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref Api, ParentId: !Ref BetaResource, PathPart: merge}

  HealthResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref Api, ParentId: !Ref BetaResource, PathPart: health}

  # The integration URI resolves a stage variable at request time. That is what
  # lets ONE deployment serve both stages: the prod stage points at the prod
  # function+alias, the test stage at the test one, and repointing is a stage
  # variable change -- no redeploy, no second API, no drift between them.
  #
  # ⚠️ The stage variable may ONLY supply the FUNCTION NAME component. Putting
  # the whole ARN in one -- `.../functions/${stageVariables.cutArn}/invocations`
  # -- is rejected at method creation with "Invalid lambda function ARN", because
  # API Gateway validates the URI shape up front and a bare variable is not a
  # parseable ARN. The rest of the ARN must be literal. Proven the hard way in a
  # sandbox account on 2026-10-07; CloudFormation does not catch it, the API does.
  #
  # The stage variable carries "functionName:alias", e.g. "cutRelease:live".
  CutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref CutResource
      HttpMethod: POST
      AuthorizationType: NONE   # Slack signs the request; see internal/slackverify
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${!stageVariables.cutFn}/invocations'

  MergeMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref MergeResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${!stageVariables.mergeFn}/invocations'

  HealthMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref HealthResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${!stageVariables.cutFn}/invocations'

  Deployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [CutMethod, MergeMethod, HealthMethod]
    Properties:
      RestApiId: !Ref Api
      # The nonce is in the Description purely so that changing it changes this
      # resource, which is what makes CloudFormation create a NEW deployment.
      # See DeploymentNonce above for why that is not optional.
      Description: !Sub 'releasebot deployment ${DeploymentNonce}'

  AccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/apigateway/releasebot
      RetentionInDays: !Ref AccessLogRetentionDays

  ProdStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref Api
      DeploymentId: !Ref Deployment
      StageName: prod
      Variables:
        cutFn: !Ref CutReleaseQualified
        mergeFn: !Ref MergebackQualified
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: !Ref ThrottleRateLimit
          ThrottlingBurstLimit: !Ref ThrottleBurstLimit
          # INFO, not full request/response logging. DataTraceEnabled writes
          # request bodies to CloudWatch, and ReleaseBot's request bodies carry
          # Slack tokens.
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt AccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "caller":"$context.identity.userAgent","requestTime":"$context.requestTime",
          "httpMethod":"$context.httpMethod","path":"$context.path",
          "status":"$context.status","latency":"$context.responseLatency",
          "integrationStatus":"$context.integration.status","stage":"$context.stage"}

  TestStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref Api
      DeploymentId: !Ref Deployment
      StageName: test
      Variables:
        cutFn: !Ref CutReleaseTestQualified
        mergeFn: !Ref MergebackTestQualified
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: !Ref ThrottleRateLimit
          ThrottlingBurstLimit: !Ref ThrottleBurstLimit
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt AccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "requestTime":"$context.requestTime","httpMethod":"$context.httpMethod",
          "path":"$context.path","status":"$context.status",
          "latency":"$context.responseLatency","stage":"$context.stage"}

  # Permission is granted per ALIAS ARN. Granting it on the unqualified function
  # ARN would let the API invoke $LATEST, which is the one version no deploy
  # gate has ever looked at.
  CutInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CutReleaseAliasArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/*'

  CutTestInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CutReleaseTestAliasArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/*'

  MergeInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MergebackAliasArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/*'

  MergeTestInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MergebackTestAliasArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/*'

  # --- Stable URL ---------------------------------------------------------
  # The single biggest avoidable cost of this migration is that the invoke URL
  # changes: https://{apiId}.execute-api.{region}.amazonaws.com/beta/cut has the
  # account's API id baked into it, so every Slack slash command, every Jira
  # webhook and every runbook that references it has to be edited at cutover.
  # A custom domain means the next move is a base-path remap, and the rollback
  # is the same remap in reverse.
  Domain:
    Type: AWS::ApiGateway::DomainName
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      RegionalCertificateArn: !Ref CertificateArn
      EndpointConfiguration: {Types: [REGIONAL]}
      SecurityPolicy: TLS_1_2

  ProdMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: HasDomain
    DependsOn: ProdStage
    Properties:
      DomainName: !Ref Domain
      RestApiId: !Ref Api
      Stage: prod
      BasePath: beta

  TestMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: HasDomain
    DependsOn: TestStage
    Properties:
      DomainName: !Ref Domain
      RestApiId: !Ref Api
      Stage: test
      BasePath: beta-test

  # ── Abuse protection ────────────────────────────────────────────────────────
  # A rate-based rule, not a rate LIMIT. A newsroom cutting releases makes a
  # handful of requests an hour; anything approaching this number is not a
  # person, and the stage's own throttle (10 rps) protects the backend but
  # still spends an invocation per request. WAF rejects before API Gateway
  # routes, so a flood costs nothing downstream.
  #
  # The managed rule sets are deliberately NOT included: this endpoint takes
  # form-encoded Slack payloads whose bodies carry arbitrary branch names and
  # commit messages, and the common rule set false-positives on those. A WAF
  # that blocks a real release is worse than no WAF.
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: WafOn
    Properties:
      Name: releasebot-edge
      Scope: REGIONAL
      DefaultAction: {Allow: {}}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: releasebot-edge
      Rules:
        - Name: rate-per-ip
          Priority: 0
          Action: {Block: {}}
          Statement:
            RateBasedStatement:
              Limit: !Ref WafRateLimitPer5Min
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: releasebot-rate-per-ip

  # ⚠️ Associated to the PROD STAGE, not to the API. A WebACL attaches to a
  # stage ARN, so test is deliberately left unprotected -- the behaviour suite
  # hammers it from CI and would trip a rate rule written for humans.
  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: WafOn
    Properties:
      ResourceArn: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${Api}/stages/prod'
      WebACLArn: !GetAtt WebAcl.Arn
    DependsOn: [ProdStage]

Outputs:
  ProdInvokeUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod'
  TestInvokeUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/test'
  CustomDomainTarget:
    Condition: HasDomain
    Value: !GetAtt Domain.RegionalDomainName
  SlackRequestUrlProd:
    Description: Paste this into the Slack app's slash command Request URL at cutover.
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod/beta/cut'
