AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ReleaseBot - compute. The four functions named in the SOW, on a provided.al2023
  Go custom runtime, each fronted by a `live` alias so that a deploy publishes an
  immutable version and a rollback is one UpdateAlias call rather than a rebuild.

Parameters:
  # ⚠️ A brand-new AWS account has a Lambda concurrency limit of TEN, and AWS
  # refuses any reservation that would leave fewer than 100 unreserved. So the
  # reservation that protects a mature account makes the stack UNDEPLOYABLE in
  # a fresh one -- and the error talks about unreserved concurrency, not about
  # the account being new. Set it to 0 to disable until the quota is raised.
  ReservedConcurrency:
    Type: Number
    Default: 5
    MinValue: 0
    Description: Per-function concurrency cap. 0 disables it (required on a new account).
  # ── VPC attachment ──────────────────────────────────────────────────────────
  # Empty = NOT attached, which is the default and the correct default: a
  # function in a VPC with no route to what it needs is a function that times
  # out, and the timeout looks like a bug in the code rather than a missing
  # route. Attachment is a deliberate act with a network behind it.
  #
  # Supplied from the outputs of 15-network.yaml.
  # ⚠️ PER ENVIRONMENT, not stack-wide. The first version of this was one pair
  # of parameters for all four functions, which quietly made VPC attachment an
  # all-or-nothing property of the whole system -- and attaching "the Lambdas"
  # then meant attaching production AND test, leaving no un-attached shape to
  # compare against. The point of the exercise is to be able to run both.
  VpcSubnetIds:            {Type: CommaDelimitedList, Default: ''}
  VpcSecurityGroupIds:     {Type: CommaDelimitedList, Default: ''}
  TestVpcSubnetIds:        {Type: CommaDelimitedList, Default: ''}
  TestVpcSecurityGroupIds: {Type: CommaDelimitedList, Default: ''}
  TestDryRun:
    Type: String
    Default: '1'
    AllowedValues: ['0', '1']
    Description: >
      Whether the TEST functions simulate their GitHub writes instead of making
      them. Default on, and deliberately not offered for production.

      A test environment that cuts real branches in a real repository is a test
      environment that files real work for somebody. Dry run keeps the whole
      path exercised -- signature check, parse, service, ledger write -- and
      stops only at the write itself, with every row it records flagged so the
      record never implies a branch that does not exist.
  ArtifactBucket:     {Type: String}
  CutReleaseKey:      {Type: String, Default: 'releasebot/cutrelease.zip'}
  # ⚠️ These were applied BY HAND and CloudFormation did not know about them.
  # A redeploy of this stack silently wiped them off the test function, which
  # then failed at INIT with "GITHUB_TOKEN is required" -- configuration drift
  # destroyed by the very tool that is supposed to own it. They are parameters
  # now so the template is the single owner.
  #
  # ⛔ This is still the WRONG long-term home. A value here is frozen into every
  # published version, which is what makes rotating a secret invalidate every
  # older version as a rollback target. The execution roles are already scoped
  # for secretsmanager:GetSecretValue on ${SecretsPrefix}/<env>/* -- resolving
  # them there at INIT is the Phase 3 change, and it is what removes the trap.
  GitHubToken:         {Type: String, NoEcho: true, Default: ''}
  SlackToken:          {Type: String, NoEcho: true, Default: ''}
  SlackSigningSecret:  {Type: String, NoEcho: true, Default: ''}
  JiraWebhookSecret:   {Type: String, NoEcho: true, Default: ''}
  MergebackKey:       {Type: String, Default: 'releasebot/mergeback.zip'}
  CutReleaseRoleArn:  {Type: String}
  CutReleaseTestRoleArn:
    Type: String
    Description: Execution role for the TEST twin. Separate from the prod one on
      purpose -- a shared role means a shared blast radius.
  MergebackTestRoleArn:
    Type: String
  MergebackRoleArn:   {Type: String}
  RarcConfigUrl:      {Type: String, Default: ''}
  DefaultOwner:       {Type: String, Default: 'msnbc'}
  SlackChannel:       {Type: String, Default: ''}
  SecretsPrefix:      {Type: String, Default: 'releasebot'}

  # Slack user IDs permitted to run /cut and /merge.
  # ⛔ EMPTY = UNRESTRICTED, which is the OPPOSITE of SlackApprovers, where
  # empty means NOBODY. Deliberate: asking for a release branch is low-risk and
  # the production gate is the approval, so defaulting to "nobody" would break
  # an existing workflow on cutover day. /health reports which mode is in force
  # (`cutAllowlist`) so "unrestricted" can never be a silent state.
  # ⚠️ IDs (U0123ABCD), never display names -- a name is chosen by its subject.
  CutAllowlist:
    Type: String
    Default: ''
    Description: Comma-separated Slack user IDs permitted to cut. Empty = anyone in the workspace.

  # ── Secrets by REFERENCE ────────────────────────────────────────────────────
  # ⛔ These four were PLAINTEXT Lambda environment variables -- a 93-character
  # GitHub token among them, readable by anyone with
  # lambda:GetFunctionConfiguration, and frozen into every published version.
  #
  # Set UseSecretReferences=true and each variable holds `ssm:<path>/<name>`,
  # resolved at INIT by internal/secretref. A literal still works unchanged, so
  # the dev account, the contract tests and the local harness are untouched --
  # and the cutover is a parameter flip rather than a rewrite.
  #
  # ⚠️ The path deliberately ends in /secrets/, a level BELOW the config path.
  # paramstore.Load reads /releasebot/<env>/ with Recursive:false and
  # WithDecryption:true, so a secret stored as an immediate child would be
  # fetched into memory on every INIT for no reason. One level down, it is not.
  UseSecretReferences:
    Type: String
    Default: 'false'
    AllowedValues: ['true','false']
    Description: >
      true = the four secret-bearing variables carry ssm: references instead of
      values. The SecureStrings must exist first -- write them with
      scripts/set-secret.sh, never through this template (a NoEcho parameter is
      still a value that travelled through a change set).
  LogRetentionDays:   {Type: Number, Default: 30}
  AlarmTopicArn:      {Type: String, Default: ''}
  DatadogExtensionArn:
    Type: String
    Default: ''
    Description: >
      Datadog Extension layer ARN. Left empty the functions still emit
      structured JSON to CloudWatch and MONITORING| metric lines, so
      observability is never gated on the vendor layer being resolvable.
  Runtime:
    Type: String
    Default: provided.al2023
    AllowedValues: [provided.al2, provided.al2023]
    Description: >
      The SOW says provided.al2. al2023 is the current generation and the same
      bootstrap contract; keeping both allowed makes the runtime bump an
      explicit, separately-approved parameter change rather than a surprise
      bundled into the migration.

Conditions:
  SecretRefs: !Equals [!Ref UseSecretReferences, 'true']
  CapConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]
  InVpc:     !Not [!Equals [!Join ['', !Ref VpcSubnetIds], '']]
  TestInVpc: !Not [!Equals [!Join ['', !Ref TestVpcSubnetIds], '']]
  HasDatadog:  !Not [!Equals [!Ref DatadogExtensionArn, '']]
  HasAlarms:   !Not [!Equals [!Ref AlarmTopicArn, '']]

# Env vars below hold REFERENCES to secrets (a Secrets Manager name prefix),
# never secret values. Anyone holding lambda:GetFunctionConfiguration can read a
# function's entire environment, and that is a far wider group than the one that
# should be able to read a GitHub token with branch-write rights on the news org.
Resources:

  # ── Where a dropped async job goes ──────────────────────────────────────────
  # Lambda retries a failed Event invocation twice and then DISCARDS IT. The
  # third failure is silent: no error reaches Slack, because the only thing
  # Slack ever saw was "Working on it...". A release simply never happens and
  # nobody is told.
  #
  # ⚠️ The failures that matter here are the ones our own code CANNOT catch --
  # a timeout, an INIT failure, a throttle, an out-of-memory kill. A try/catch
  # inside the handler cannot report any of those, because the handler is what
  # died. That is why this is a Lambda destination and not error handling.
  AsyncFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: releasebot-async-failures
      # 14 days: a release dropped on a Friday must still be there on Monday.
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # A DLQ nobody looks at is a wastebasket. One message is already too many --
  # it means a release was accepted and never performed.
  AsyncFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: releasebot-async-job-dropped
      AlarmDescription: >
        A ReleaseBot slash command was acknowledged in Slack and then failed
        every retry. Someone believes a release was cut and it was not.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - {Name: QueueName, Value: !GetAtt AsyncFailureQueue.QueueName}
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # An empty queue reports no datapoints rather than zero, and the default
      # (missing = breaching) would hold this alarm permanently in ALARM.
      TreatMissingData: notBreaching

  # ── The release ledger ──────────────────────────────────────────────────────
  # What did we ship, for which property, closing which tickets?
  #
  # Today that question is answered by scrolling Slack, and Slack is not a
  # record: messages are edited, channels are archived, and nobody can answer
  # "what went out for TODAY last Thursday" six weeks later. CloudWatch logs
  # hold the facts but expire, and querying them is a Logs Insights job rather
  # than a page somebody opens.
  #
  # One row per cut and per mergeback, written by ReleaseBot itself at the
  # moment it does the work -- not by the pipeline, and not by a human
  # afterwards. A record written by the thing that performed the action is the
  # only kind that cannot drift from what happened.
  LedgerTable:
    Type: AWS::DynamoDB::Table
    # ⛔ Retain. This is an audit record of what shipped to production. A stack
    # delete that silently takes the release history with it is the behaviour
    # you discover during the audit, not before it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: releasebot-ledger
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}   # ENV#prod | ENV#test
        - {AttributeName: sk, AttributeType: S}   # <rfc3339>#<repo>#<action>
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      # ⚠️ NO SSESpecification, and that is deliberate.
      #
      # `SSEEnabled: true` does not mean "encrypt this table" -- the table is
      # ALREADY encrypted at rest with an AWS-owned key and always has been.
      # It means "use the AWS MANAGED key aws/dynamodb instead", and that key
      # does not exist in a brand-new account until something creates it. The
      # stack then fails with a KMS NotFoundException naming a key id that
      # appears nowhere in the template, which reads as a permissions problem.
      #
      # Found by running bootstrap.sh in a genuinely empty account. It would
      # never have surfaced in an account that had ever used DynamoDB.
      # Set it explicitly only if a customer-managed key is a requirement.
      Tags:
        - {Key: app, Value: releasebot}

  # Log groups are declared, not left to Lambda's implicit creation. An implicit
  # group is created with NEVER EXPIRE retention and is not owned by the stack,
  # so it survives the decommission step and keeps billing for storage on an
  # application nobody can invoke any more.
  CutReleaseLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/cutRelease
      RetentionInDays: !Ref LogRetentionDays
  CutReleaseTestLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/cutReleaseTest
      RetentionInDays: !Ref LogRetentionDays
  MergebackLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/releaseAutomationMergeback
      RetentionInDays: !Ref LogRetentionDays
  MergebackTestLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/releaseAutomationMergebackTest
      RetentionInDays: !Ref LogRetentionDays

  CutRelease:
    Type: AWS::Lambda::Function
    DependsOn: CutReleaseLogGroup
    Properties:
      FunctionName: cutRelease           # name preserved per the SOW
      Runtime: !Ref Runtime
      Handler: bootstrap                 # ignored by provided.*, required by the API
      Architectures: [x86_64]
      Role: !Ref CutReleaseRoleArn
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref CutReleaseKey}
      MemorySize: 512
      Timeout: 30
      # A release-cutting bot should never be able to run 1,000 copies of
      # itself. This also caps the blast radius of a retry storm from Jira.
      ReservedConcurrentExecutions: !If [CapConcurrency, !Ref ReservedConcurrency, !Ref 'AWS::NoValue']
      Layers: !If [HasDatadog, [!Ref DatadogExtensionArn], !Ref 'AWS::NoValue']
      VpcConfig: !If
        - InVpc
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref 'AWS::NoValue'
      Environment:
        Variables:
          RARC_ENV: prod
          RARC_CONFIG_URL: !Ref RarcConfigUrl
          DEFAULT_OWNER: !Ref DefaultOwner
          SLACK_CHANNEL: !Ref SlackChannel
          RELEASEBOT_CUT_ALLOWLIST: !Ref CutAllowlist
          SECRETS_PREFIX: !Sub '${SecretsPrefix}/prod'
          RELEASEBOT_ACK_ONLY: '1'
          DD_SERVICE: releasebot
          DD_ENV: prod
          DD_SITE: datadoghq.com
          DD_TRACE_ENABLED: 'true'
          GITHUB_TOKEN: !If [SecretRefs, 'ssm:/releasebot/prod/secrets/github-token', !Ref GitHubToken]
          SLACK_TOKEN: !If [SecretRefs, 'ssm:/releasebot/prod/secrets/slack-token', !Ref SlackToken]
          SLACK_SIGNING_SECRET: !If [SecretRefs, 'ssm:/releasebot/prod/secrets/slack-signing-secret', !Ref SlackSigningSecret]
          JIRA_WEBHOOK_SECRET: !If [SecretRefs, 'ssm:/releasebot/prod/secrets/jira-webhook-secret', !Ref JiraWebhookSecret]
      Tags:
        - {Key: app,        Value: releasebot}
        - {Key: migration,  Value: msnbc-dev-to-msnbc-prod}

  CutReleaseVersion:
    Type: AWS::Lambda::Version
    # ⛔ THE DESCRIPTION MUST CARRY THE ARTIFACT KEY.
    # AWS::Lambda::Version publishes a new version only when the VERSION
    # RESOURCE changes. A fixed description never changes, so a deploy with a
    # new binary updated $LATEST, left `live` pointing at version 1, reported
    # CREATE/UPDATE_COMPLETE, and kept serving the OLD code. The stack is green
    # and the fix is not deployed -- the single most dangerous shape a deploy
    # can have, and invisible unless you read the alias back.
    # The key is content-addressed, so a changed binary changes this string,
    # which forces a new version, which moves the alias.
    Properties:
      FunctionName: !Ref CutRelease
      Description: !Sub 'deployed by ${AWS::StackName} from ${CutReleaseKey}'

  CutReleaseAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref CutRelease
      FunctionVersion: !GetAtt CutReleaseVersion.Version
      Name: live

  CutReleaseTest:
    Type: AWS::Lambda::Function
    DependsOn: CutReleaseTestLogGroup
    Properties:
      FunctionName: cutReleaseTest
      Runtime: !Ref Runtime
      Handler: bootstrap
      Architectures: [x86_64]
      Role: !Ref CutReleaseTestRoleArn
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref CutReleaseKey}
      MemorySize: 512
      Timeout: 30
      # Routed through the same switch as prod: on an account whose total
      # concurrency limit is 10, AWS refuses ANY reservation, so a hardcoded
      # literal here makes the whole stack un-creatable in a fresh account.
      ReservedConcurrentExecutions: !If [CapConcurrency, 2, !Ref 'AWS::NoValue']
      Layers: !If [HasDatadog, [!Ref DatadogExtensionArn], !Ref 'AWS::NoValue']
      VpcConfig: !If
        - TestInVpc
        - SubnetIds: !Ref TestVpcSubnetIds
          SecurityGroupIds: !Ref TestVpcSecurityGroupIds
        - !Ref 'AWS::NoValue'
      Environment:
        Variables:
          RARC_ENV: test
          RELEASEBOT_DRY_RUN: !Ref TestDryRun
          RARC_CONFIG_URL: !Ref RarcConfigUrl
          DEFAULT_OWNER: !Ref DefaultOwner
          SLACK_CHANNEL: !Ref SlackChannel
          RELEASEBOT_CUT_ALLOWLIST: !Ref CutAllowlist
          SECRETS_PREFIX: !Sub '${SecretsPrefix}/test'
          RELEASEBOT_ACK_ONLY: '1'
          DD_SERVICE: releasebot
          DD_ENV: test
          GITHUB_TOKEN: !If [SecretRefs, 'ssm:/releasebot/test/secrets/github-token', !Ref GitHubToken]
          SLACK_TOKEN: !If [SecretRefs, 'ssm:/releasebot/test/secrets/slack-token', !Ref SlackToken]
          SLACK_SIGNING_SECRET: !If [SecretRefs, 'ssm:/releasebot/test/secrets/slack-signing-secret', !Ref SlackSigningSecret]
          JIRA_WEBHOOK_SECRET: !If [SecretRefs, 'ssm:/releasebot/test/secrets/jira-webhook-secret', !Ref JiraWebhookSecret]
          DD_SITE: datadoghq.com
      Tags:
        - {Key: app, Value: releasebot}

  CutReleaseTestVersion:
    Type: AWS::Lambda::Version
    # See CutReleaseVersion: the description carries the content-addressed
    # key so a new binary forces a new version and the alias follows.
    Properties:
      FunctionName: !Ref CutReleaseTest
      Description: !Sub 'deployed by ${AWS::StackName} from ${CutReleaseKey}'
  CutReleaseTestAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref CutReleaseTest
      FunctionVersion: !GetAtt CutReleaseTestVersion.Version
      Name: live

  Mergeback:
    Type: AWS::Lambda::Function
    DependsOn: MergebackLogGroup
    Properties:
      FunctionName: releaseAutomationMergeback
      Runtime: !Ref Runtime
      Handler: bootstrap
      Architectures: [x86_64]
      Role: !Ref MergebackRoleArn
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref MergebackKey}
      MemorySize: 512
      Timeout: 30
      ReservedConcurrentExecutions: !If [CapConcurrency, !Ref ReservedConcurrency, !Ref 'AWS::NoValue']
      Layers: !If [HasDatadog, [!Ref DatadogExtensionArn], !Ref 'AWS::NoValue']
      VpcConfig: !If
        - InVpc
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref 'AWS::NoValue'
      Environment:
        Variables:
          RARC_ENV: prod
          RARC_CONFIG_URL: !Ref RarcConfigUrl
          DEFAULT_OWNER: !Ref DefaultOwner
          SLACK_CHANNEL: !Ref SlackChannel
          RELEASEBOT_CUT_ALLOWLIST: !Ref CutAllowlist
          SECRETS_PREFIX: !Sub '${SecretsPrefix}/prod'
          RELEASEBOT_ACK_ONLY: '1'
          DD_SERVICE: releasebot
          DD_ENV: prod
          GITHUB_TOKEN: !If [SecretRefs, 'ssm:/releasebot/prod/secrets/github-token', !Ref GitHubToken]
          SLACK_TOKEN: !If [SecretRefs, 'ssm:/releasebot/prod/secrets/slack-token', !Ref SlackToken]
          SLACK_SIGNING_SECRET: !If [SecretRefs, 'ssm:/releasebot/prod/secrets/slack-signing-secret', !Ref SlackSigningSecret]
          JIRA_WEBHOOK_SECRET: !If [SecretRefs, 'ssm:/releasebot/prod/secrets/jira-webhook-secret', !Ref JiraWebhookSecret]
      Tags:
        - {Key: app, Value: releasebot}

  MergebackVersion:
    Type: AWS::Lambda::Version
    # See CutReleaseVersion: the description carries the content-addressed
    # key so a new binary forces a new version and the alias follows.
    Properties:
      FunctionName: !Ref Mergeback
      Description: !Sub 'deployed by ${AWS::StackName} from ${MergebackKey}'
  MergebackAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref Mergeback
      FunctionVersion: !GetAtt MergebackVersion.Version
      Name: live

  MergebackTest:
    Type: AWS::Lambda::Function
    DependsOn: MergebackTestLogGroup
    Properties:
      FunctionName: releaseAutomationMergebackTest
      Runtime: !Ref Runtime
      Handler: bootstrap
      Architectures: [x86_64]
      Role: !Ref MergebackTestRoleArn
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref MergebackKey}
      MemorySize: 512
      Timeout: 30
      # Routed through the same switch as prod: on an account whose total
      # concurrency limit is 10, AWS refuses ANY reservation, so a hardcoded
      # literal here makes the whole stack un-creatable in a fresh account.
      ReservedConcurrentExecutions: !If [CapConcurrency, 2, !Ref 'AWS::NoValue']
      Layers: !If [HasDatadog, [!Ref DatadogExtensionArn], !Ref 'AWS::NoValue']
      VpcConfig: !If
        - TestInVpc
        - SubnetIds: !Ref TestVpcSubnetIds
          SecurityGroupIds: !Ref TestVpcSecurityGroupIds
        - !Ref 'AWS::NoValue'
      Environment:
        Variables:
          RARC_ENV: test
          RELEASEBOT_DRY_RUN: !Ref TestDryRun
          RARC_CONFIG_URL: !Ref RarcConfigUrl
          DEFAULT_OWNER: !Ref DefaultOwner
          SLACK_CHANNEL: !Ref SlackChannel
          RELEASEBOT_CUT_ALLOWLIST: !Ref CutAllowlist
          SECRETS_PREFIX: !Sub '${SecretsPrefix}/test'
          RELEASEBOT_ACK_ONLY: '1'
          DD_SERVICE: releasebot
          DD_ENV: test
          GITHUB_TOKEN: !If [SecretRefs, 'ssm:/releasebot/test/secrets/github-token', !Ref GitHubToken]
          SLACK_TOKEN: !If [SecretRefs, 'ssm:/releasebot/test/secrets/slack-token', !Ref SlackToken]
          SLACK_SIGNING_SECRET: !If [SecretRefs, 'ssm:/releasebot/test/secrets/slack-signing-secret', !Ref SlackSigningSecret]
          JIRA_WEBHOOK_SECRET: !If [SecretRefs, 'ssm:/releasebot/test/secrets/jira-webhook-secret', !Ref JiraWebhookSecret]
      Tags:
        - {Key: app, Value: releasebot}

  MergebackTestVersion:
    Type: AWS::Lambda::Version
    # See CutReleaseVersion: the description carries the content-addressed
    # key so a new binary forces a new version and the alias follows.
    Properties:
      FunctionName: !Ref MergebackTest
      Description: !Sub 'deployed by ${AWS::StackName} from ${MergebackKey}'
  MergebackTestAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref MergebackTest
      FunctionVersion: !GetAtt MergebackTestVersion.Version
      Name: live

  # --- Alarms -------------------------------------------------------------
  # Errors is the obvious one. The two that actually catch this application
  # failing are below it: a 401 rate that jumps (someone pointed Slack at the
  # wrong account, or the signing secret rotation half-landed) and a function
  # that stops being invoked at all (the cutover moved traffic and nobody
  # noticed the old one went quiet).

  CutReleaseErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarms
    Properties:
      AlarmName: releasebot-cutRelease-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref CutRelease}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]

  CutReleaseThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarms
    Properties:
      AlarmName: releasebot-cutRelease-throttles
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{Name: FunctionName, Value: !Ref CutRelease}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]

  UnauthorizedRequestsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarms
    Properties:
      AlarmName: releasebot-unauthorized-spike
      Namespace: ReleaseBot
      MetricName: AuthRejected
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]

  UnauthorizedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CutReleaseLogGroup
      FilterPattern: '{ $.message = "rejected*" }'
      MetricTransformations:
        - MetricNamespace: ReleaseBot
          MetricName: AuthRejected
          MetricValue: '1'
          DefaultValue: 0

  # ⚠️ FunctionName is !Ref, NOT the literal name, and that distinction makes
  # the difference between a stack that deploys into an empty account and one
  # that cannot. A literal string makes CloudFormation's
  # AWS::EarlyValidation::ResourceExistenceCheck look for a function that
  # ALREADY EXISTS, so the create is rejected before anything is built -- with
  # a detail-free "Validation failed with 1 error(s)" and no resource-level
  # event to read. It worked in the account where this was written only because
  # the functions were already there.
  #
  # !Ref on an AWS::Lambda::Function returns its NAME, so this is identical at
  # runtime and additionally tells CloudFormation about the dependency.
  CutReleaseAsyncConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref CutRelease
      Qualifier: live
      # Two retries, then the DLQ. `cut` is idempotent -- a branch that already
      # exists at the same SHA is treated as success -- so retrying is safe and
      # a transient GitHub blip should not cost a release.
      MaximumRetryAttempts: 2
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt AsyncFailureQueue.Arn
    DependsOn: [CutReleaseAlias]

  CutReleaseTestAsyncConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref CutReleaseTest
      Qualifier: live
      # Two retries, then the DLQ. `cut` is idempotent -- a branch that already
      # exists at the same SHA is treated as success -- so retrying is safe and
      # a transient GitHub blip should not cost a release.
      MaximumRetryAttempts: 2
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt AsyncFailureQueue.Arn
    DependsOn: [CutReleaseTestAlias]

  MergebackAsyncConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref Mergeback
      Qualifier: live
      # Two retries, then the DLQ. `cut` is idempotent -- a branch that already
      # exists at the same SHA is treated as success -- so retrying is safe and
      # a transient GitHub blip should not cost a release.
      MaximumRetryAttempts: 2
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt AsyncFailureQueue.Arn
    DependsOn: [MergebackAlias]

  MergebackTestAsyncConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref MergebackTest
      Qualifier: live
      # Two retries, then the DLQ. `cut` is idempotent -- a branch that already
      # exists at the same SHA is treated as success -- so retrying is safe and
      # a transient GitHub blip should not cost a release.
      MaximumRetryAttempts: 2
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt AsyncFailureQueue.Arn
    DependsOn: [MergebackTestAlias]

Outputs:
  CutReleaseAliasArn:      {Value: !Ref CutReleaseAlias}
  CutReleaseTestAliasArn:  {Value: !Ref CutReleaseTestAlias}
  MergebackAliasArn:       {Value: !Ref MergebackAlias}
  MergebackTestAliasArn:   {Value: !Ref MergebackTestAlias}
  CutReleaseName:          {Value: !Ref CutRelease}
  CutReleaseTestName:      {Value: !Ref CutReleaseTest}
  MergebackName:           {Value: !Ref Mergeback}
  MergebackTestName:       {Value: !Ref MergebackTest}
