AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ReleaseBot - the Slack approval endpoint.

  ⚠️ This stack WEAKENS the production gate, deliberately. GitHub's
  required-reviewer rule says "only these named people, signed in to GitHub, may
  approve". Once this exists, a Slack button can approve instead, and GitHub
  records every such approval as the single token-holder this function carries --
  so the audit trail stops saying WHO decided.

  Kept as a SEPARATE stack for exactly that reason: deleting this one stack
  removes the alternate path and leaves GitHub's own gate intact. That is a much
  easier thing to reason about, and to reverse, than an option buried inside the
  main API stack.

Parameters:
  # ⚠️ Attached to the SAME VPC as the production release functions. This
  # function is part of production even though it lives in a different stack,
  # and "everything is in the VPC" was not true while it sat outside -- a
  # boundary with a hole in it is not a boundary, it is a diagram.
  VpcSubnetIds:        {Type: CommaDelimitedList, Default: ''}
  VpcSecurityGroupIds: {Type: CommaDelimitedList, Default: ''}
  ArtifactBucket:   {Type: String}
  ArtifactKey:      {Type: String, Default: 'releasebot/slackapprove.zip'}
  RestApiId:        {Type: String, Description: 'Existing ReleaseBot API id'}
  BetaResourceId:   {Type: String, Description: 'Resource id of /beta on that API'}
  StageName:        {Type: String, Default: prod}
  GitHubOwner:      {Type: String, Default: vamsiatluri}
  GitHubRepo:       {Type: String, Default: releasebot-demo}
  GitHubEnvironmentId: {Type: String}
  SlackApprovers:
    Type: String
    Default: ''
    Description: >
      Comma-separated Slack user ids permitted to approve. ⚠️ EMPTY MEANS NOBODY
      -- the handler fails closed. Read as "allow everyone", a blank value would
      turn a misconfiguration into an open door on a public endpoint that can
      deploy to production.
  # ── The two secrets: a NAME, never a value ──────────────────────────────
  # ⚠️ A NoEcho CloudFormation parameter is masked in describe-stacks and is
  # STILL a value that travelled through a template, a change set, and whatever
  # archives change sets. Passing the parameter NAME instead means the secret
  # never enters CloudFormation at all -- it is written once by
  # scripts/set-secret.sh and read at INIT.
  #
  # Empty keeps the old behaviour: the literal in SlackSigningSecret is used.
  # That is deliberate, so this template can be deployed before the secrets are
  # migrated and the cutover is a parameter change rather than a rewrite.
  # ⚠️ A DISTINCT NAME from the release functions' signing secret, which holds a
  # DIFFERENT value. Pointing both at one parameter would silently change one
  # component's behaviour, and "they are both the Slack signing secret" is an
  # assumption about two values that are not equal. If they SHOULD be the same,
  # that is a deliberate change with its own verification, not a side effect of
  # tidying parameter names.
  SlackSigningSecretParam:
    Type: String
    Default: /releasebot/prod/secrets/slack-approve-signing-secret
    Description: SSM SecureString parameter NAME holding the Slack signing secret.
  GitHubApprovalTokenParam:
    Type: String
    Default: /releasebot/prod/secrets/github-approval-token
    Description: >
      SSM SecureString parameter NAME holding the CLASSIC PAT used to approve
      deployments. ⛔ A fine-grained token cannot approve one at all.
  SlackSigningSecret: {Type: String, NoEcho: true, Default: ''}
  GitHubApprovalToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: >
      ⛔ A CLASSIC PAT with the `repo` scope. A FINE-GRAINED token CANNOT approve
      a deployment at all -- not with any permission set. It returns 403 even
      with Actions: read and write, and the 403 reads as a missing permission,
      so the natural response is to keep granting permissions that cannot fix
      it. This is the identity every Slack-originated approval is recorded as.
      Set it with scripts/set-approval-token.sh, which refuses fine-grained
      tokens outright.
  LogRetentionDays: {Type: Number, Default: 7}
  # See 20-lambda.yaml: names the ACCOUNT so the approval REPLY says what it
  # just deployed to. Two environments share one Slack app.
  AccountLabel: {Type: String, Default: unlabelled}
  ReservedConcurrency:
    Type: Number
    Default: 2
    MinValue: 0
    Description: >
      Per-function concurrency cap. 0 disables it entirely, which is REQUIRED on
      an account whose total concurrency limit is below 110 -- AWS refuses any
      reservation that leaves fewer than 100 unreserved, and a new account gets
      ten. The failure names unreserved concurrency, never the account's age.

Conditions:
  InVpc: !Not [!Equals [!Join ['', !Ref VpcSubnetIds], '']]
  CapConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]
  # References win when BOTH names are given. Requiring both prevents the
  # half-migrated state where one secret is a reference and the other is still
  # a literal -- /health would report "mixed", and a partly-hardened function
  # that reads as hardened is the failure this whole change is about.
  UseSecretRefs: !And
    - !Not [!Equals [!Ref SlackSigningSecretParam, '']]
    - !Not [!Equals [!Ref GitHubApprovalTokenParam, '']]

Resources:

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        # Required before a function can be VPC-attached: Lambda creates the ENI
        # AS THIS ROLE, and without it UpdateFunctionConfiguration is rejected
        # with an error naming CreateNetworkInterface but not the policy.
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        # ── Reading its own two secrets, and nothing else ──────────────────
        # This function holds the two most dangerous values in the system: the
        # Slack signing secret, which is the only thing proving a request came
        # from Slack, and a CLASSIC PAT with `repo`, which can push to every
        # repository its owner can reach. They were plaintext environment
        # variables, readable by anyone with lambda:GetFunctionConfiguration.
        #
        # ⚠️ Scoped to the two parameter names, NOT to the prefix. This
        # function has no reason to read the release functions' configuration,
        # and a prefix grant would let it.
        - PolicyName: read-its-own-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SlackSigningSecretParam}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GitHubApprovalTokenParam}'
              # ⛔ ViaService must name SSM. A SecureString decrypt goes via
              # ssm, not secretsmanager, and getting this wrong fails with an
              # AccessDenied that names KMS -- so the instinct is to widen the
              # key policy, which cannot fix a wrong condition.
              - Effect: Allow
                Action: [kms:Decrypt]
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/slackApprove
      RetentionInDays: !Ref LogRetentionDays

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: slackApprove
      Runtime: provided.al2
      Handler: bootstrap
      Architectures: [x86_64]
      Role: !GetAtt ExecutionRole.Arn
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ArtifactKey}
      MemorySize: 256
      Timeout: 15
      # A button that approves production deploys has no reason to run at scale.
      # Capping it bounds what a flood of forged clicks can cost, even though
      # each one is rejected.
      ReservedConcurrentExecutions: !If [CapConcurrency, !Ref ReservedConcurrency, !Ref 'AWS::NoValue']
      VpcConfig: !If
        - InVpc
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref 'AWS::NoValue'
      Environment:
        Variables:
          # A reference, resolved at INIT by internal/secretref. A literal
          # still works unchanged -- that is what lets the dev account and the
          # contract tests keep passing values.
          SLACK_SIGNING_SECRET: !If
            - UseSecretRefs
            - !Sub 'ssm:${SlackSigningSecretParam}'
            - !Ref SlackSigningSecret
          GITHUB_APPROVAL_TOKEN: !If
            - UseSecretRefs
            - !Sub 'ssm:${GitHubApprovalTokenParam}'
            - !Ref GitHubApprovalToken
          GITHUB_OWNER: !Ref GitHubOwner
          GITHUB_REPO: !Ref GitHubRepo
          GITHUB_ENVIRONMENT_ID: !Ref GitHubEnvironmentId
          SLACK_APPROVERS: !Ref SlackApprovers
          RELEASEBOT_ACCOUNT_LABEL: !Ref AccountLabel

  SlackResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref RestApiId, ParentId: !Ref BetaResourceId, PathPart: slack}

  InteractResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref RestApiId, ParentId: !Ref SlackResource, PathPart: interact}

  InteractMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApiId
      ResourceId: !Ref InteractResource
      HttpMethod: POST
      # No authorizer: Slack signs the request, and that signature is the
      # authentication. An API Gateway authorizer cannot verify it, because the
      # check is an HMAC over the exact body.
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Function.Arn}/invocations'

  Deployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: InteractMethod
    Properties: {RestApiId: !Ref RestApiId}

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt Function.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/*/*/*'

Outputs:
  RequestUrl:
    Description: Paste this into the Slack app's Interactivity Request URL.
    Value: !Sub 'https://${RestApiId}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/beta/slack/interact'
  FunctionName: {Value: !Ref Function}
