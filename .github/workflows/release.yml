name: release

# The pipeline this project is actually about.
#
#   build once  ──►  deploy to TEST  ──►  behaviour suite
#                                              │
#                                     ⏸ waits for a human
#                                              │
#                    deploy to PROD  ──►  behaviour suite
#
# Two properties are the whole point:
#
#  1. ONE artifact. The prod job does not rebuild -- it deploys the exact bytes
#     the test job validated, and both jobs verify the deployed code fingerprint
#     against the digest the build job published. "We shipped what we tested" is
#     a check, not a hope.
#
#  2. The gate is real. The prod job names a GitHub Environment with a required
#     reviewer, so the run pauses there until a person approves. Nothing in the
#     pipeline can route around it.

on:
  push:
    branches: [main]
    # A documentation commit must not create a release candidate. It did: a
    # docs-only push built, deployed to test, and parked a second approval
    # request in the channel beside the first. Two pending approvals for the
    # same code is how a gate stops being read and starts being clicked
    # through -- and an approval gate that gets rubber-stamped is worse than
    # no gate, because it still looks like a control.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# ⚠️ A run held at the approval gate SURVIVES the next push, and then sits there
# offering to deploy code that production has already moved past. That happened:
# #29 was approved and promoted while #28 was still pending on an OLDER commit --
# one click away from a silent downgrade of production.
#
# Newer runs therefore cancel older ones of this workflow, INCLUDING one parked
# at the gate. The queue is the thing that must not accumulate: two pending
# approvals is how a gate stops being read and starts being clicked through.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write      # required for OIDC. Without it the assume-role fails with
                       # a confusing "Not authorized to perform
                       # sts:AssumeRoleWithWebIdentity".

env:
  AWS_REGION: us-east-1

jobs:

  build:
    name: 1 · Build once — no AWS credentials
    runs-on: ubuntu-latest
    outputs:
      sha:   ${{ steps.meta.outputs.sha }}
      cut:   ${{ steps.digest.outputs.cut }}
      merge: ${{ steps.digest.outputs.merge }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.22', cache: true}

      - name: Unit tests — is each piece of the code correct?
        run: go test ./... -count=1

      - name: Vet — static analysis the compiler does not do
        run: go vet ./...

      - name: Behaviour suite vs FAKE Slack/Jira/GitHub — free, no credentials
        # Free, no AWS, no credentials. Catches behaviour regressions before
        # anything is deployed anywhere.
        env:
          SLACK_SIGNING_SECRET: local-dev-signing-secret
          JIRA_WEBHOOK_SECRET: local-dev-jira-secret
        run: |
          set -euo pipefail
          source scripts/harness.sh && harness_up
          go run ./cmd/contracttest -base http://localhost:8080 -env local \
            -repo msnbc/news-app-shadow -mutating -summary "$GITHUB_STEP_SUMMARY"

      - name: Package both Lambdas (linux/amd64, bootstrap at the zip root)
        run: make package

      - name: Resolve the commit this release is of
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fingerprint both zips — the identity checked after every deploy
        id: digest
        # The artifact's identity. Compared against the deployed CodeSha256 after
        # every deploy, in every environment.
        run: |
          echo "cut=$(openssl dgst -sha256 -binary build/cutrelease.zip | base64)"  >> "$GITHUB_OUTPUT"
          echo "merge=$(openssl dgst -sha256 -binary build/mergeback.zip | base64)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: releasebot-${{ steps.meta.outputs.sha }}
          path: build/*.zip
          retention-days: 30

      - name: Record the artifact's identity on the run page
        run: |
          {
            echo "### One artifact, built once"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${{ steps.meta.outputs.sha }}\` |"
            echo "| cutRelease sha256 | \`${{ steps.digest.outputs.cut }}\` |"
            echo "| mergeback sha256 | \`${{ steps.digest.outputs.merge }}\` |"
            echo ""
            echo "Every later \"fingerprint matches\" check on this page compares against these"
            echo "two values, read back from the running function in AWS."
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: 2 · Deploy to test + verify the deployed bytes
    needs: build
    runs-on: ubuntu-latest
    environment: test
    outputs:
      api: ${{ steps.url.outputs.base }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.22', cache: true}
      - name: Fetch the artifact the build job produced — do NOT rebuild
        uses: actions/download-artifact@v4
        with:
          name: "releasebot-${{ needs.build.outputs.sha }}"
          path: build

      # No AWS key anywhere. The only stored value is a role ARN, which is not a
      # credential -- it is useless without the trust policy naming this repo.
      - name: Ask AWS for temporary credentials — OIDC, no stored key
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: releasebot-test-${{ github.run_id }}

      - name: Which AWS account did OIDC actually put us in?
        run: aws sts get-caller-identity --query Account --output text

      - name: Stage the artifact in S3 (a handoff, not a trigger)
        run: |
          set -euo pipefail
          B="releasebot-artifacts-$(aws sts get-caller-identity --query Account --output text)"
          aws s3 cp build/cutrelease.zip "s3://$B/releasebot/${{ needs.build.outputs.sha }}/cutrelease.zip"
          aws s3 cp build/mergeback.zip  "s3://$B/releasebot/${{ needs.build.outputs.sha }}/mergeback.zip"

      - name: Deploy BOTH test functions — publish version, move the live alias
        run: bash scripts/ci-deploy.sh test "${{ needs.build.outputs.sha }}"

      - name: Read the fingerprint BACK off AWS and compare
        run: |
          set -euo pipefail
          bash scripts/ci-verify-digest.sh cutReleaseTest                   '${{ needs.build.outputs.cut }}'
          bash scripts/ci-verify-digest.sh releaseAutomationMergebackTest   '${{ needs.build.outputs.merge }}'

      - name: Resolve the test stage's public URL from CloudFormation
        id: url
        run: |
          set -euo pipefail
          U=$(aws cloudformation describe-stacks --stack-name releasebot-edge \
                --query "Stacks[0].Outputs[?OutputKey=='TestInvokeUrl'].OutputValue" --output text)
          [ -n "$U" ] && [ "$U" != "None" ] || { echo "::error::could not resolve the API URL"; exit 1; }
          echo "base=${U%/test}" >> "$GITHUB_OUTPUT"

      - name: Behaviour suite vs the LIVE test endpoint — this is the gate
        env:
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          JIRA_WEBHOOK_SECRET: ${{ secrets.JIRA_WEBHOOK_SECRET }}
        run: |
          go run ./cmd/contracttest -base "${{ steps.url.outputs.base }}/test" -env test \
            -metrics metrics-test.json -summary "$GITHUB_STEP_SUMMARY"

      - name: Publish the test result to CloudWatch
        if: always()
        run: |
          [ -f metrics-test.json ] || exit 0
          aws cloudwatch put-metric-data --namespace ReleaseBot --metric-data file://metrics-test.json

  # Fires the moment the gate engages. `prod` cannot start until a human approves,
  # so this runs alongside that wait and tells somebody the decision is theirs --
  # with the steps, because a notification that says a decision is needed without
  # saying where to make it only moves the question.
  notify-gate:
    name: 3 · Tell Slack the gate is open
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tell Slack an approval is waiting
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          bash scripts/ci-slack-notify.sh awaiting \
            "${{ needs.build.outputs.sha }}" \
            "${{ github.actor }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ github.run_id }}"

      - name: Say on the run page what is being asked, and of whom
        run: |
          {
            echo "### ⏸ Waiting for a person"
            echo ""
            echo "Test is running \`${{ needs.build.outputs.sha }}\` and passed its behaviour"
            echo "suite against the live endpoint. **Production is untouched.**"
            echo ""
            echo "It stays untouched until a named reviewer approves — here, or from the"
            echo "Approve button in Slack. The hold is enforced by the \`production\`"
            echo "environment's required-reviewer rule, not by a condition in this workflow,"
            echo "so editing this file cannot route around it."
          } >> "$GITHUB_STEP_SUMMARY"

  prod:
    name: 4 · Promote the SAME artifact to production
    needs: [build, test]
    runs-on: ubuntu-latest
    # ⏸ THE GATE.
    #
    # `environment: production` carries a required-reviewer rule, so the run
    # STOPS here. GitHub marks the job "Waiting", emails the reviewer, and the
    # deploy sits there until a person clicks Approve. Nothing in the pipeline
    # can route around it -- the gate is enforced by GitHub, not by a condition
    # the workflow could be edited to skip.
    #
    # ⚠️ This rule is only offered on PUBLIC repositories below the Team tier.
    # On a private repo, even with Pro, creating it is refused with a billing
    # error (HTTP 422) -- which is why this repository is public. On a private
    # repo without Team, the nearest equivalent is gating the job on a
    # deliberate workflow_dispatch input: still a human decision, still recorded
    # against their account, but enforced by the workflow rather than by GitHub.
    environment: production
    steps:
      # fetch-depth 0 because the guard below asks a question about HISTORY --
      # "is this commit behind what is live?" -- and a shallow clone cannot
      # answer it. `git merge-base --is-ancestor` on a depth-1 checkout fails
      # with a "not a valid object" error that reads like a bad SHA.
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.22', cache: true}

      # ── THE DOWNGRADE GUARD ────────────────────────────────────────────────
      # An approval is a human decision made at a point in time, and the time
      # between the decision and the click is unbounded -- a release can sit at
      # the gate for a day. Meanwhile other releases ship. Approving the old one
      # then REPLACES NEWER PRODUCTION CODE WITH OLDER CODE, and every check in
      # this pipeline passes while it happens: the artifact is valid, the
      # fingerprints match, the behaviour suite is green. It is a correct deploy
      # of the wrong thing.
      #
      # This nearly happened: #29 was approved and promoted while #28 sat
      # pending on an earlier commit, one click from a silent rollback nobody
      # asked for.
      #
      # A concurrency group makes it unlikely. This makes it IMPOSSIBLE: ask
      # production what it is actually running, and refuse if this commit is an
      # ancestor of it. The authority is the deployed endpoint, not a workflow
      # variable -- same principle as reading the fingerprint back instead of
      # trusting the deploy call.
      - name: Refuse to promote a commit that is BEHIND production
        env:
          PROD_HEALTH_URL: https://0aohv0kx5k.execute-api.us-east-1.amazonaws.com/prod/beta/health
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -uo pipefail
          # ⚠️ sed, not a multi-line python heredoc. A continuation line inside
          # a YAML block scalar must stay indented past the block, and a python
          # snippet whose second line starts at column 1 silently ends the
          # block -- the workflow then fails to parse with no line number.
          LIVE=$(curl -fsS --max-time 10 "$PROD_HEALTH_URL" 2>/dev/null \
                 | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')

          if [ -z "$LIVE" ]; then
            # Fail OPEN, loudly. Production being unreachable is a reason to
            # look, not a reason to block a deploy that might be the fix for it.
            echo "::warning::could not read production's current commit; the downgrade guard did not run"
            exit 0
          fi
          echo "production is running: $LIVE"
          echo "this run would promote: $SHA"

          if [ "$LIVE" = "$SHA" ]; then
            echo "already live — this promotion is a no-op, continuing"
            exit 0
          fi
          if git merge-base --is-ancestor "$SHA" "$LIVE" 2>/dev/null; then
            echo "::error::REFUSED — $SHA is an ANCESTOR of the live commit $LIVE."
            echo "::error::Approving this run would replace production with OLDER code."
            echo "::error::If you intend to go back, use the rollback workflow: it checks that"
            echo "::error::the target can actually start before moving the alias."
            exit 1
          fi
          echo "✓ $SHA is ahead of production — promotion is a roll FORWARD"
      - name: Fetch the artifact the build job produced — do NOT rebuild
        uses: actions/download-artifact@v4
        with:
          name: "releasebot-${{ needs.build.outputs.sha }}"
          path: build

      - name: Ask AWS for temporary credentials — OIDC, no stored key
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: releasebot-prod-${{ github.run_id }}

      - name: Promote — same bytes, no build step anywhere in this job
        # Note what is absent: no build step. The bytes came from the build job's
        # artifact, which the test job has already exercised end to end.
        run: bash scripts/ci-deploy.sh prod "${{ needs.build.outputs.sha }}"

      - name: Prove production's fingerprint equals test's
        run: |
          set -euo pipefail
          bash scripts/ci-verify-digest.sh cutRelease                  '${{ needs.build.outputs.cut }}'
          bash scripts/ci-verify-digest.sh releaseAutomationMergeback  '${{ needs.build.outputs.merge }}'

      - name: Behaviour suite vs the LIVE production endpoint
        env:
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          JIRA_WEBHOOK_SECRET: ${{ secrets.JIRA_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          U=$(aws cloudformation describe-stacks --stack-name releasebot-edge \
                --query "Stacks[0].Outputs[?OutputKey=='ProdInvokeUrl'].OutputValue" --output text)
          go run ./cmd/contracttest -base "$U" -env prod \
            -metrics metrics-prod.json -summary "$GITHUB_STEP_SUMMARY"

      - name: Publish the production result to CloudWatch
        if: always()
        run: |
          [ -f metrics-prod.json ] || exit 0
          aws cloudwatch put-metric-data --namespace ReleaseBot --metric-data file://metrics-prod.json

      # The PIPELINE notifies, not a person and not a chat assistant. That is the
      # distinction worth keeping: a release notification nobody has to remember
      # to send is the only kind that stays accurate.
      - name: Tell Slack what shipped
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PROD_HEALTH_URL: https://0aohv0kx5k.execute-api.us-east-1.amazonaws.com/prod/beta/health
        run: |
          bash scripts/ci-slack-notify.sh promoted \
            "${{ needs.build.outputs.sha }}" \
            "${{ github.actor }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Record what shipped
        run: |
          {
            echo "### Promoted to production"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${{ needs.build.outputs.sha }}\` |"
            echo "| approved by | @${{ github.actor }} |"
            echo "| cutRelease fingerprint | \`${{ needs.build.outputs.cut }}\` |"
            echo "| mergeback fingerprint | \`${{ needs.build.outputs.merge }}\` |"
            echo ""
            echo "No rebuild happened between test and production. These are the same bytes."
          } >> "$GITHUB_STEP_SUMMARY"

  # A release that fails must say so. Without this, the channel only ever carries
  # good news -- and a quiet channel then looks identical to a healthy one, which
  # is the same failure mode as an alarm that cannot fire.
  notify-failure:
    name: Report a failed release
    needs: [build, test, notify-gate, prod]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tell Slack the release failed
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          bash scripts/ci-slack-notify.sh failed \
            "${{ needs.build.outputs.sha || github.sha }}" \
            "${{ github.actor }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
